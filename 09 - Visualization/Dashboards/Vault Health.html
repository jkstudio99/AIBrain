<!doctype html>
<html lang="th" data-theme="system">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Vault Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --font-en:'IBM Plex Sans',system-ui,sans-serif;
    --font-th:'IBM Plex Sans Thai',var(--font-en);
    --font-num:'IBM Plex Mono',ui-monospace,monospace;
    --font:var(--font-th),var(--font-en);
    --radius:14px; --radius-lg:20px;
    --ease:cubic-bezier(.16,1,.3,1); --dur:240ms;
    --good:#10b981; --bad:#ef4444; --warn:#f59e0b; --acc:#6366f1; --acc-2:#8b5cf6;
    --bg:#fafafa;
    --bg-grad:radial-gradient(1200px 600px at 80% -10%,#eef2ff 0%,transparent 60%),
              radial-gradient(900px 500px at -10% 110%,#fef3f2 0%,transparent 55%),#fafafa;
    --card:rgba(255,255,255,.85); --card-hi:rgba(255,255,255,.96);
    --line:rgba(15,23,42,.08); --line-2:rgba(15,23,42,.14);
    --text:#0f172a; --muted:#475569; --dim:#94a3b8;
    --glass:rgba(255,255,255,.6);
    color-scheme:light;
  }
  html[data-theme="dark"] {
    --bg:#06080f;
    --bg-grad:radial-gradient(1200px 600px at 80% -10%,rgba(99,102,241,.10) 0%,transparent 60%),#06080f;
    --card:rgba(20,24,40,.65); --card-hi:rgba(28,33,54,.85);
    --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.12);
    --text:#f1f5f9; --muted:#94a3b8; --dim:#64748b;
    --glass:rgba(8,10,18,.55);
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark) {
    html[data-theme="system"] {
      --bg:#06080f;
      --bg-grad:radial-gradient(1200px 600px at 80% -10%,rgba(99,102,241,.10) 0%,transparent 60%),#06080f;
      --card:rgba(20,24,40,.65); --card-hi:rgba(28,33,54,.85);
      --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.12);
      --text:#f1f5f9; --muted:#94a3b8; --dim:#64748b;
      --glass:rgba(8,10,18,.55);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh;background:var(--bg-grad);color:var(--text);
    font-family:var(--font);-webkit-font-smoothing:antialiased}
  [data-num],.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

  .topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);background:var(--glass);
    border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;
    justify-content:space-between;gap:16px;padding:14px 24px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700}
  .brand-logo{width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--acc),var(--acc-2));
    display:grid;place-items:center;color:white}
  .brand-text .t1{font-size:14px;font-weight:700}
  .brand-text .t2{font-size:11px;color:var(--muted)}
  .seg{position:relative;display:inline-flex;background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg-btn{appearance:none;border:0;background:transparent;color:var(--muted);
    font-family:inherit;padding:7px 12px;border-radius:999px;cursor:pointer;
    font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
    transition:color var(--dur) var(--ease),background var(--dur) var(--ease)}
  .seg-btn:hover{color:var(--text)}
  .seg-btn[aria-pressed="true"]{background:var(--card-hi);color:var(--text);font-weight:600}
  .seg-btn svg{width:14px;height:14px}

  .wrap{max-width:1240px;margin:0 auto;padding:32px 24px 80px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-bottom:28px;flex-wrap:wrap}
  .head h1{margin:0;font-size:32px;letter-spacing:-.025em;font-weight:800;
    background:linear-gradient(180deg,var(--text),var(--muted) 200%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .head .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .meta-pill{background:var(--card);border:1px solid var(--line);padding:8px 14px;
    border-radius:999px;font-size:12px;color:var(--muted)}

  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  @media (max-width:880px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:22px;backdrop-filter:blur(8px);transition:transform var(--dur) var(--ease),
    border-color var(--dur) var(--ease)}
  .card:hover{transform:translateY(-1px);border-color:var(--line-2)}
  .card-title{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.12em;margin:0 0 14px;font-weight:600}
  .kpi .lbl{color:var(--muted);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;font-weight:600}
  .kpi .val{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
  .kpi .meta{color:var(--dim);font-size:12px;margin-top:8px}
  .kpi.good .val{color:var(--good)}
  .kpi.warn .val{color:var(--warn)}
  .kpi.bad  .val{color:var(--bad)}

  .row2{grid-template-columns:1fr 1fr}
  @media (max-width:880px){.row2{grid-template-columns:1fr}}
  .chart-wrap{height:260px;position:relative}
  .chart-wrap.tall{height:320px}

  .tag-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  @media (max-width:660px){.tag-grid{grid-template-columns:1fr}}
  .tag-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;
    background:var(--card-hi);border:1px solid var(--line);font-size:12px}
  .tag-row code{font-family:var(--font-num);color:var(--text);font-size:11px}
  .tag-row .n{margin-left:auto;font-weight:700;color:var(--muted);font-family:var(--font-num)}

  .footer{margin-top:40px;color:var(--dim);font-size:12px;text-align:center}
  .reveal{opacity:0;transform:translateY(12px);filter:blur(4px);
    transition:opacity 700ms var(--ease),transform 700ms var(--ease),filter 700ms var(--ease)}
  .reveal.in{opacity:1;transform:translateY(0);filter:blur(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <div class="brand-text">
        <div class="t1">Vault Health</div>
        <div class="t2" id="subTop">—</div>
      </div>
    </div>
    <div class="seg" role="group">
      <button class="seg-btn" data-theme="light" aria-pressed="false">Light</button>
      <button class="seg-btn" data-theme="dark"  aria-pressed="false">Dark</button>
      <button class="seg-btn" data-theme="system" aria-pressed="true">System</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="head reveal">
    <div>
      <h1>🩺 Vault Health</h1>
      <div class="sub" id="subLabel">—</div>
    </div>
    <div class="meta-pill">generated <span id="genTime">—</span></div>
  </div>

  <div class="grid kpis reveal" style="margin-bottom:16px">
    <div class="card kpi">
      <div class="lbl">Total notes</div>
      <div class="val" data-num id="kpiTotal">0</div>
      <div class="meta" id="kpiTotalMeta">—</div>
    </div>
    <div class="card kpi good">
      <div class="lbl">Recent (7d)</div>
      <div class="val" data-num id="kpiRecent">0</div>
      <div class="meta">notes added/edited</div>
    </div>
    <div class="card kpi">
      <div class="lbl">Wikilinks</div>
      <div class="val" data-num id="kpiLinks">0</div>
      <div class="meta" id="kpiLinksMeta">—</div>
    </div>
    <div class="card kpi warn">
      <div class="lbl">Orphans</div>
      <div class="val" data-num id="kpiOrphans">0</div>
      <div class="meta" id="kpiOrphansMeta">—</div>
    </div>
  </div>

  <div class="grid row2 reveal" style="margin-bottom:16px">
    <div class="card">
      <div class="card-title">Notes by status</div>
      <div class="chart-wrap"><canvas id="statusChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Notes by PARA folder</div>
      <div class="chart-wrap"><canvas id="folderChart"></canvas></div>
    </div>
  </div>

  <div class="card reveal" style="margin-bottom:16px">
    <div class="card-title">Activity (last 30 days)</div>
    <div class="chart-wrap tall"><canvas id="activityChart"></canvas></div>
  </div>

  <div class="card reveal">
    <div class="card-title">Top tags</div>
    <div class="tag-grid" id="tagGrid"></div>
  </div>

  <div class="footer">AI Brain · Vault Health</div>
</div>

<script>
(function(){
"use strict";
const PAYLOAD = {"today": "2026-05-01", "n_total": 225, "recent_count": 64, "total_links": 1449, "link_density": 6.44, "n_orphans": 1, "evergreen_ratio": 15.6, "untagged_ratio": 78.7, "by_folder": [["05 - Daily Systems", 80], ["03 - Resources", 48], ["07 - Prompt Library", 23], ["10 - Meta", 22], ["02 - Areas", 15], ["01 - Projects", 10], ["MOCs", 9], ["08 - Automation", 6], ["09 - Visualization", 6], ["00 - Inbox", 2], ["🏠 Home.md", 1], ["AGENTS.md", 1], ["CLAUDE.md", 1], ["Excalidraw", 1]], "by_status": {"fleeting": 1, "seedling": 1, "growing": 11, "evergreen": 35, "untagged": 177}, "top_tags": [["type/resource", 75], ["type/daily", 71], ["status/evergreen", 35], ["area/tech", 27], ["status/growing", 23], ["area/dev", 22], ["topic/ai-workflow", 20], ["status/seedling", 17], ["area/finance", 17], ["area/cybersecurity", 16], ["topic/news", 16], ["area/ai", 16], ["type/prompt", 15], ["type/moc", 14], ["type/playbook", 14], ["area/meta", 13], ["topic/finance", 13], ["area/investment", 12], ["topic/company-news", 12], ["topic/crypto", 12]], "activity": {"2026-05-01": 9, "2026-04-16": 102, "2026-04-19": 36, "2026-04-25": 12, "2026-04-30": 6, "2026-04-26": 8, "2026-04-27": 9, "2026-04-17": 12, "2026-04-28": 4, "2026-04-29": 8, "2026-04-24": 8, "2026-04-18": 5, "2026-04-20": 6}, "generated": "2026-05-01 06:35"};
const $ = (id) => document.getElementById(id);
const html = document.documentElement;
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
const fmt = (n) => Number(n).toLocaleString();

function setTheme(m) {
  html.setAttribute('data-theme', m);
  ls.set('vh_theme', m);
  document.querySelectorAll('[data-theme]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.theme === m ? 'true' : 'false'));
  if (window._charts) renderCharts();
}
document.querySelectorAll('.seg-btn[data-theme]').forEach(b =>
  b.addEventListener('click', () => setTheme(b.dataset.theme)));
setTheme(ls.get('vh_theme') || 'system');

function chartColors() {
  const isDark = (html.getAttribute('data-theme') === 'dark') ||
                 (html.getAttribute('data-theme') === 'system' &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches);
  return {
    grid: isDark ? 'rgba(255,255,255,.06)' : 'rgba(15,23,42,.06)',
    tick: isDark ? '#94a3b8' : '#475569',
    bg:   isDark ? 'rgba(20,24,40,.95)' : 'rgba(255,255,255,.98)',
    isDark,
  };
}

function fillKpis() {
  $('subTop').textContent  = PAYLOAD.today + ' · ' + fmt(PAYLOAD.n_total) + ' notes';
  $('subLabel').textContent = PAYLOAD.today;
  $('genTime').textContent  = PAYLOAD.generated;
  $('kpiTotal').textContent  = fmt(PAYLOAD.n_total);
  $('kpiTotalMeta').textContent = 'evergreen ' + PAYLOAD.evergreen_ratio + '%';
  $('kpiRecent').textContent = fmt(PAYLOAD.recent_count);
  $('kpiLinks').textContent  = fmt(PAYLOAD.total_links);
  $('kpiLinksMeta').textContent = PAYLOAD.link_density + ' / note';
  $('kpiOrphans').textContent = fmt(PAYLOAD.n_orphans);
  $('kpiOrphansMeta').textContent = ((PAYLOAD.n_orphans / Math.max(1, PAYLOAD.n_total)) * 100).toFixed(1) + '% of total';
}

function renderTags() {
  const el = $('tagGrid'); el.innerHTML = '';
  if (!PAYLOAD.top_tags || !PAYLOAD.top_tags.length) {
    el.innerHTML = '<div class="tag-row">—</div>'; return;
  }
  PAYLOAD.top_tags.forEach(([t, n]) => {
    el.insertAdjacentHTML('beforeend',
      `<div class="tag-row"><code>#${t}</code><span class="n">${n}</span></div>`);
  });
}

function renderCharts() {
  if (typeof Chart === 'undefined') return;
  const c = chartColors();
  if (!window._charts) window._charts = {};
  ['status','folder','activity'].forEach(k => {
    if (window._charts[k]) { window._charts[k].destroy(); window._charts[k] = null; }
  });

  // Status doughnut
  const statusKeys = Object.keys(PAYLOAD.by_status);
  const statusVals = statusKeys.map(k => PAYLOAD.by_status[k]);
  const statusColors = {
    fleeting:'#94a3b8', seedling:'#10b981', growing:'#3b82f6',
    evergreen:'#8b5cf6', untagged:'#f59e0b'
  };
  window._charts.status = new Chart($('statusChart'), {
    type:'doughnut',
    data:{ labels:statusKeys,
           datasets:[{ data:statusVals,
                       backgroundColor:statusKeys.map(k=>statusColors[k]||'#94a3b8'),
                       borderColor:'transparent', borderWidth:3, spacing:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
              plugins:{ legend:{ position:'bottom',
                                 labels:{ color:c.tick, usePointStyle:true,
                                          pointStyle:'circle', font:{size:11} } },
                        tooltip:{ backgroundColor:c.bg, titleColor:c.isDark?'#f1f5f9':'#0f172a',
                                  bodyColor:c.isDark?'#f1f5f9':'#0f172a',
                                  borderColor:c.grid, borderWidth:1, padding:12, cornerRadius:8 } } }
  });

  // Folder bar
  const folders = PAYLOAD.by_folder.map(x=>x[0]);
  const folderVals = PAYLOAD.by_folder.map(x=>x[1]);
  const folderColors = ['#6366f1','#8b5cf6','#ef4444','#f59e0b','#10b981','#3b82f6','#06b6d4','#84cc16','#94a3b8','#475569','#a855f7','#ec4899'];
  window._charts.folder = new Chart($('folderChart'), {
    type:'bar',
    data:{ labels:folders,
           datasets:[{ data:folderVals,
                       backgroundColor:folders.map((_,i)=>folderColors[i % folderColors.length]),
                       borderRadius:6, barPercentage:.85 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
              plugins:{ legend:{display:false},
                        tooltip:{ backgroundColor:c.bg,
                                  titleColor:c.isDark?'#f1f5f9':'#0f172a',
                                  bodyColor:c.isDark?'#f1f5f9':'#0f172a',
                                  borderColor:c.grid, borderWidth:1, padding:12,
                                  cornerRadius:8 } },
              scales:{ x:{ ticks:{color:c.tick}, grid:{color:c.grid} },
                       y:{ ticks:{color:c.tick, font:{size:11}}, grid:{display:false} } } }
  });

  // Activity line (last 30 days)
  const today = new Date(PAYLOAD.today);
  const days = [], counts = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const k = d.toISOString().slice(0,10);
    days.push(k.slice(5));
    counts.push(PAYLOAD.activity[k] || 0);
  }
  window._charts.activity = new Chart($('activityChart'), {
    type:'line',
    data:{ labels:days,
           datasets:[{ label:'notes', data:counts, borderColor:'#6366f1',
                       backgroundColor:'rgba(99,102,241,.12)', tension:.35,
                       fill:true, pointRadius:3, borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false,
              plugins:{ legend:{display:false},
                        tooltip:{ backgroundColor:c.bg,
                                  titleColor:c.isDark?'#f1f5f9':'#0f172a',
                                  bodyColor:c.isDark?'#f1f5f9':'#0f172a',
                                  borderColor:c.grid, borderWidth:1, padding:12,
                                  cornerRadius:8 } },
              scales:{ x:{ ticks:{color:c.tick, maxTicksLimit:10},
                           grid:{display:false} },
                       y:{ ticks:{color:c.tick, precision:0},
                           grid:{color:c.grid}, beginAtZero:true } } }
  });
}

function reveal() {
  document.querySelectorAll('.reveal').forEach((el,i) =>
    setTimeout(()=>el.classList.add('in'), 60 + i*70));
}

fillKpis(); renderTags(); renderCharts(); reveal();
})();
</script>
</body>
</html>
